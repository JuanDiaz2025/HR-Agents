[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hr-agents"
version = "0.1.0"
description = "AI video evaluation and decision pipeline for applicant screening"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=1.0.0",
    "pydantic>=2.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
sheets = [
    "google-api-python-client>=2.100",
    "google-auth>=2.23",
]
transcribe = [
    "faster-whisper>=1.0",
]
dev = [
    "pytest>=7.4",
]

[project.scripts]
hr-agents = "hr_agents.cli:main"

[tool.setuptools.packages.find]
include = ["hr_agents*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
