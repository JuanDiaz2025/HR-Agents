[project]
name = "hr-agents"
version = "0.1.0"
description = "AI Interviewer for Google Meet - Recall.ai bot + Claude interview engine + Sheets/Monday.com automation"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ISC", "DTZ", "RUF"]
ignore = [
    "E501",    # line length is handled by the formatter
    "B008",    # FastAPI's Depends()/Header() in defaults is the documented idiom
    "UP042",   # `str, Enum` is deliberate: it serialises identically everywhere
]
extend-select = ["E402"]
