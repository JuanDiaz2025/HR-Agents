# Job applicant video screening rubric.
#
# Edit this file to change how videos are scored — no code changes required.
# Criterion weights must sum to 100 or the pipeline refuses to start.

version: 1
name: "Job applicant video screening"

decision:
  pass_threshold: 75        # weighted score >= this  -> PASS
  review_threshold: 70      # model confidence < this -> NEEDS REVIEW (no auto-decision)
  auto_fail_on_compliance: true   # any criterion marked compliance:true scoring 0 -> NOT PASS
  flags_requiring_review:
    - unintelligible_audio
    - video_truncated
    - wrong_person_or_topic
    - possible_ai_generated
    - prohibited_content
    - duplicate_submission
    - technical_error

criteria:
  - id: communication
    name: "Communication & clarity"
    weight: 20
    description: >
      Speech is intelligible and well paced. Ideas are organized and easy to
      follow. Audio and video quality are good enough to assess the response.
    scoring:
      0: "Largely unintelligible, or audio/video unusable."
      50: "Understandable but rambling, rushed, or hard to follow in places."
      100: "Clear, well organized, and easy to follow throughout."

  - id: completeness
    name: "Completeness"
    weight: 20
    description: >
      Every question the applicant was asked to answer is addressed with enough
      substance to judge.
    scoring:
      0: "Most questions unaddressed."
      50: "Some questions addressed, others skipped or answered superficially."
      100: "All questions addressed with substance."

  - id: relevant_experience
    name: "Relevant experience"
    weight: 20
    description: >
      Concrete, specific evidence of experience relevant to the role — real
      examples of work done, not general statements of interest or enthusiasm.
    scoring:
      0: "No relevant experience described."
      50: "Relevant experience claimed but described only in generalities."
      100: "Specific examples with enough detail to verify in an interview."

  - id: consistency
    name: "Consistency with application"
    weight: 15
    description: >
      Statements in the video are internally consistent and consistent with the
      written form response. No claims that contradict the submitted application.
    scoring:
      0: "Clear contradictions with the written application."
      50: "Minor inconsistencies or unverifiable claims."
      100: "Consistent with the application and internally coherent."

  - id: compliance
    name: "Instruction compliance"
    weight: 10
    compliance: true
    description: >
      The submission follows the stated instructions — required topics covered,
      within the stated length, correct format, no prohibited content.
    scoring:
      0: "A required instruction was ignored or a rule was broken."
      50: "Followed, but incompletely."
      100: "Fully compliant with the submission instructions."

  - id: professionalism
    name: "Professionalism"
    weight: 15
    description: >
      Respectful, appropriately prepared, and engaged for a workplace context.
    scoring:
      0: "Unprofessional or inappropriate conduct."
      50: "Acceptable but visibly unprepared or disengaged."
      100: "Prepared, respectful, and appropriately engaged."

# Add your own criteria above. Any criterion in this list is automatically
# scored and included in the weighted total — remember to rebalance weights.

# Factors the evaluator must NOT consider, for any criterion, in any direction.
# This list is injected verbatim into every evaluation prompt.
prohibited_factors:
  - "Race, ethnicity, skin tone, or national origin"
  - "Sex, gender identity, or gender expression"
  - "Age or apparent age"
  - "Disability, health conditions, or medical appearance"
  - "Religion or religious dress"
  - "Pregnancy or family status"
  - "Physical attractiveness, body type, or grooming beyond stated requirements"
  - "Accent or dialect, except where it genuinely prevents comprehension"
  - "Home environment, background, or apparent socioeconomic status"
  - "Video or audio equipment quality, except where it prevents assessment"
